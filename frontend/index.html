<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>News Sentiment Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>📊 Stock News Sentiment Analyzer</h1>
      <p class="subtitle">NIFTY-50 companies only &mdash; results depend on the FastAPI backend running locally</p>
    </header>

    <!-- backend status pill, checked on load and after each request -->
    <div id="status" class="status status--unknown">Checking backend...</div>

    <section class="card">
      <h2>Analyze a headline</h2>
      <div class="input-row">
        <input id="headline-input" type="text" placeholder="e.g. Reliance rises but HDFC falls after market pressure" />
        <button id="analyze-btn">Analyze</button>
      </div>
      <div id="analyze-results" class="results"></div>
    </section>

    <section class="card">
      <h2>Live market news</h2>
      <button id="live-btn">Fetch Live News</button>
      <div id="live-results" class="results"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
